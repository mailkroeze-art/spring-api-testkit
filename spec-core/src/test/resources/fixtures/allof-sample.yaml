openapi: 3.0.3
info:
  title: AllOf Sample
  version: "1.0.0"
paths:
  /widgets/{widgetId}:
    get:
      operationId: getWidget
      security: []
      parameters:
        - name: widgetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
components:
  schemas:
    NewWidget:
      type: object
      required:
        - label
      properties:
        label:
          type: string
    Widget:
      allOf:
        - $ref: "#/components/schemas/NewWidget"
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
